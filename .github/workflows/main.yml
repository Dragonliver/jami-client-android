name: Build Jami Android APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            build-essential \
            swig \
            yasm \
            ninja-build \
            m4 \
            autotools-dev \
            autopoint \
            libtool \
            openjdk-17-jdk

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK inside jami-android
        run: |
          cd jami-android
          
          # Динамически патчим правила загрузки GMP внутри репозитория демона, 
          # чтобы вместо недоступного ftpmirror использовалось зеркало Debian
          echo "Patching GMP rules.mak to avoid 502 Bad Gateway..."
          GMP_RULES="../daemon/contrib/src/gmp/rules.mak"
          if [ -f "$GMP_RULES" ]; then
            sed -i 's|https://ftpmirror.gnu.org/gmp/gmp-6.3.0.tar.xz|https://deb.debian.org/debian/pool/main/g/gmp/gmp_6.3.0.orig.tar.xz|g' "$GMP_RULES"
            sed -i 's|ftp://.*|https://deb.debian.org/debian/pool/main/g/gmp/gmp_6.3.0.orig.tar.xz|g' "$GMP_RULES"
          fi

          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jami-custom-debug-apk
          path: |
            **/*.apk
            !**/build/intermediates/**
