name: Build Jami Android

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Клонирование репозитория вместе с подмодулями (чтобы появилась папка daemon)
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. Установка необходимых системных зависимостей
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            build-essential \
            swig \
            yasm \
            ninja-build \
            m4 \
            autotools-dev \
            autopoint \
            libtool

      # 3. Настройка Java (нужна для сборки Android-приложений)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. Сборка проекта
      - name: Build with Gradle
        run: |
          cd jami-android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 5. Сохранение собранного APK в качестве артефакта GitHub
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: jami-android/app/build/outputs/apk/debug/app-debug.apk
