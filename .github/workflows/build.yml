name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Update system
        run: |
          sudo apt-get update
          sudo apt-get upgrade -y

      - name: Install all build dependencies
        run: |
          sudo apt-get install -y \
            build-essential \
            gcc \
            g++ \
            make \
            git \
            wget \
            curl \
            ca-certificates \
            pkg-config \
            autoconf \
            automake \
            autopoint \
            gettext \
            gettext-base \
            libtool \
            libtool-bin \
            m4 \
            cmake \
            ninja-build \
            meson \
            python3 \
            python3-pip \
            yasm \
            nasm \
            bison \
            flex \
            patch \
            unzip \
            zip \
            xz-utils \
            zlib1g-dev \
            libssl-dev \
            libxml2-dev \
            libxslt1-dev \
            libffi-dev \
            libncurses-dev

      - name: Verify build tools
        run: |
          echo "Checking tools..."
          
          which autopoint
          autopoint --version

          autoconf --version
          automake --version
          libtool --version
          cmake --version
          ninja --version
          pkg-config --version

      - name: Fix gettext autopoint path
        run: |
          if ! command -v autopoint >/dev/null 2>&1; then
            sudo find /usr -name autopoint -type f
            sudo ln -sf $(sudo find /usr -name autopoint -type f | head -1) /usr/local/bin/autopoint
          fi

          autopoint --version

      - name: Prepare contrib
        run: |
          cd contrib

          ./bootstrap

      - name: Build contrib libraries
        run: |
          cd contrib

          make fetch
          make -j$(nproc)

      - name: Configure project
        run: |
          ./bootstrap

          ./configure \
            --enable-static \
            --disable-shared

      - name: Build project
        run: |
          make -j$(nproc)

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            **/bin/**
            **/*.exe
            **/*.dll
            **/*.so
