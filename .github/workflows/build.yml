name: Build Jami Android

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Клонирование репозитория вместе с подмодулями (включая daemon)
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. Установка необходимых системных зависимостей для сборки под Android
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            build-essential \
            swig \
            yasm \
            ninja-build \
            m4 \
            autotools-dev \
            autopoint \
            libtool \
            python3 \
            python3-pip \
            wget \
            git

      # 3. Настройка Java (необходима для сборки Android/Gradle)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. Настройка Android SDK (требуется скриптом сборки)
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. Запуск официального скрипта сборки Jami
      - name: Build Jami Android with build.py
        run: |
          python3 build.py --android
