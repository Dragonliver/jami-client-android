name: Build Jami Android

on:
  push:
    branches:
      - main

  workflow_dispatch:


jobs:

  build:

    runs-on: ubuntu-latest


    env:
      ANDROID_NDK_VERSION: 26.3.11579264


    steps:


      # -----------------------------
      # Checkout
      # -----------------------------
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive



      # -----------------------------
      # Dependencies
      # -----------------------------
      - name: Install dependencies
        shell: bash
        run: |

          sudo apt-get update


          sudo apt-get install -y \
            build-essential \
            gcc \
            g++ \
            make \
            git \
            wget \
            curl \
            ca-certificates \
            pkg-config \
            autoconf \
            automake \
            gettext \
            gettext-base \
            libtool \
            libtool-bin \
            cmake \
            ninja-build \
            meson \
            python3 \
            unzip \
            zip \
            xz-utils \
            zlib1g-dev \
            libssl-dev \
            libxml2-dev \
            libxslt1-dev \
            libffi-dev \
            libncurses-dev \
            libyaml-cpp-dev





      # -----------------------------
      # Fix autopoint
      # -----------------------------
      - name: Fix autopoint
        shell: bash
        run: |


          AUTOPOINT=$(find /usr -type f -name autopoint 2>/dev/null | head -1)



          if [ -z "$AUTOPOINT" ]; then

            sudo apt-get install --reinstall -y gettext

            AUTOPOINT=$(find /usr -type f -name autopoint 2>/dev/null | head -1)

          fi



          sudo chmod +x "$AUTOPOINT"



          sudo ln -sf "$AUTOPOINT" /usr/bin/autopoint

          sudo ln -sf "$AUTOPOINT" /usr/local/bin/autopoint



          echo "/usr/local/bin" >> $GITHUB_PATH

          echo "/usr/bin" >> $GITHUB_PATH



          autopoint --version





      # -----------------------------
      # Fix GNU mirrors
      # -----------------------------
      - name: Fix GNU download mirrors
        shell: bash
        run: |


          echo "Replacing bad GNU mirrors"



          find daemon/contrib/src \
          -name rules.mak \
          -type f \
          -exec sed -i \
          's|https://ftpmirror.gnu.org|https://ftp.gnu.org/gnu|g' {} \;



          echo "Done"





      # -----------------------------
      # Patch gnutls autoreconf
      # -----------------------------
      - name: Patch gnutls autoreconf
        shell: bash
        run: |


          FILE="daemon/contrib/src/gnutls/rules.mak"



          if [ -f "$FILE" ]; then


            sed -i \
            's|autoreconf|PATH=/usr/local/bin:/usr/bin autoreconf|g' \
            "$FILE"


          fi



          grep -n autoreconf "$FILE" || true





      # -----------------------------
      # Android SDK
      # -----------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3





      # -----------------------------
      # Android NDK
      # -----------------------------
      - name: Install NDK
        shell: bash
        run: |


          sdkmanager \
          "ndk;${ANDROID_NDK_VERSION}"





      # -----------------------------
      # Bootstrap contrib
      # -----------------------------
      - name: Bootstrap contrib
        shell: bash
        run: |


          export PATH="/usr/local/bin:/usr/bin:$PATH"



          cd daemon/contrib



          ./bootstrap





      # -----------------------------
      # Build contrib
      # -----------------------------
      - name: Build contrib
        shell: bash
        run: |


          export PATH="/usr/local/bin:/usr/bin:$PATH"



          cd daemon/contrib



          echo "Checking tools"


          which autopoint

          autopoint --version



          make fetch



          make -j$(nproc)





      # -----------------------------
      # Build project
      # -----------------------------
      - name: Build APK
        shell: bash
        run: |


          export PATH="/usr/local/bin:/usr/bin:$PATH"



          chmod +x gradlew



          ./gradlew \
            assembleDebug \
            --no-daemon \
            --stacktrace





      # -----------------------------
      # Upload
      # -----------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4

        with:

          name: jami-debug-apk

          path: |

            **/build/outputs/apk/**/*.apk
