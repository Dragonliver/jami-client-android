name: Build Jami Android

on:
  push:
    branches:
      - main

  workflow_dispatch:


jobs:

  build:

    runs-on: ubuntu-latest


    env:
      ANDROID_NDK_VERSION: 26.3.11579264


    steps:


      # ---------------------------------
      # Checkout
      # ---------------------------------
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive



      # ---------------------------------
      # Update system
      # ---------------------------------
      - name: Update system
        run: |

          sudo apt-get update

          sudo apt-get upgrade -y



      # ---------------------------------
      # Install dependencies
      # ---------------------------------
      - name: Install build dependencies
        shell: bash
        run: |

          sudo apt-get update


          sudo apt-get install -y \
            build-essential \
            gcc \
            g++ \
            make \
            git \
            wget \
            curl \
            ca-certificates \
            pkg-config \
            autoconf \
            automake \
            gettext \
            gettext-base \
            libtool \
            libtool-bin \
            m4 \
            cmake \
            ninja-build \
            meson \
            python3 \
            python3-pip \
            yasm \
            nasm \
            bison \
            flex \
            patch \
            unzip \
            zip \
            xz-utils \
            zlib1g-dev \
            libssl-dev \
            libxml2-dev \
            libxslt1-dev \
            libffi-dev \
            libncurses-dev



      # ---------------------------------
      # Fix autopoint globally
      # ---------------------------------
      - name: Setup autopoint
        shell: bash
        run: |


          echo "Searching autopoint..."


          sudo apt-get install --reinstall -y gettext gettext-base


          AUTOPOINT=$(find /usr -type f -name autopoint 2>/dev/null | head -1)



          if [ -z "$AUTOPOINT" ]; then

            echo "ERROR: autopoint not found"

            dpkg -L gettext

            exit 1

          fi



          echo "Found:"
          echo "$AUTOPOINT"



          sudo chmod +x "$AUTOPOINT"



          sudo ln -sf "$AUTOPOINT" /usr/bin/autopoint

          sudo ln -sf "$AUTOPOINT" /usr/local/bin/autopoint



          echo "/usr/bin" >> $GITHUB_PATH

          echo "/usr/local/bin" >> $GITHUB_PATH



          echo "Testing autopoint"



          which autopoint

          autopoint --version





      # ---------------------------------
      # Check tools
      # ---------------------------------
      - name: Check tools
        run: |


          echo "PATH:"
          echo $PATH


          echo "autopoint:"
          which autopoint
          autopoint --version


          echo "autoconf:"
          autoconf --version


          echo "automake:"
          automake --version


          echo "libtool:"
          libtool --version





      # ---------------------------------
      # Android SDK
      # ---------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3



      # ---------------------------------
      # Android NDK
      # ---------------------------------
      - name: Install Android NDK
        run: |


          sdkmanager \
            "ndk;${ANDROID_NDK_VERSION}"





      # ---------------------------------
      # Bootstrap contrib
      # ---------------------------------
      - name: Bootstrap contrib
        run: |


          cd daemon/contrib


          ./bootstrap





      # ---------------------------------
      # Build contrib
      # ---------------------------------
      - name: Build contrib
        shell: bash
        run: |


          cd daemon/contrib



          echo "===== AUTIPOINT CHECK BEFORE MAKE ====="



          AUTOPOINT=$(find /usr -type f -name autopoint 2>/dev/null | head -1)


          if [ -z "$AUTOPOINT" ]; then
              echo "autopoint missing before contrib build"
              exit 1
          fi



          sudo ln -sf "$AUTOPOINT" /usr/bin/autopoint

          sudo ln -sf "$AUTOPOINT" /usr/local/bin/autopoint



          export PATH="/usr/local/bin:/usr/bin:$PATH"



          which autopoint

          autopoint --version



          echo "===== FETCH ====="



          make fetch



          echo "===== BUILD ====="



          make -j$(nproc)





      # ---------------------------------
      # Build APK
      # ---------------------------------
      - name: Build Android APK
        run: |


          chmod +x gradlew



          ./gradlew \
            assembleDebug \
            --no-daemon \
            --stacktrace





      # ---------------------------------
      # Upload
      # ---------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4

        with:

          name: jami-debug-apk

          path: |

            **/build/outputs/apk/**/*.apk
