name: Build Jami Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_NDK_VERSION: 26.3.11579264

    steps:

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive


      # -----------------------------
      # System update
      # -----------------------------
      - name: Update system
        run: |
          sudo apt-get update
          sudo apt-get upgrade -y


      # -----------------------------
      # Build dependencies
      # -----------------------------
      - name: Install build dependencies
        run: |
          sudo apt-get install -y \
            build-essential \
            gcc \
            g++ \
            make \
            git \
            wget \
            curl \
            ca-certificates \
            pkg-config \
            autoconf \
            automake \
            gettext \
            gettext-base \
            libtool \
            libtool-bin \
            m4 \
            cmake \
            ninja-build \
            meson \
            python3 \
            python3-pip \
            yasm \
            nasm \
            bison \
            flex \
            patch \
            unzip \
            zip \
            xz-utils \
            zlib1g-dev \
            libssl-dev \
            libxml2-dev \
            libxslt1-dev \
            libffi-dev \
            libncurses-dev


      # -----------------------------
      # Fix autopoint
      # -----------------------------
      - name: Install and fix autopoint
        run: |

          echo "Searching autopoint..."

          AUTOPOINT=$(find /usr -name autopoint -type f 2>/dev/null | head -1)

          if [ -z "$AUTOPOINT" ]; then

            echo "autopoint not found, reinstall gettext"

            sudo apt-get remove -y gettext || true
            sudo apt-get install -y gettext

            AUTOPOINT=$(find /usr -name autopoint -type f 2>/dev/null | head -1)

          fi


          if [ -n "$AUTOPOINT" ]; then

            echo "Found:"
            echo $AUTOPOINT

            sudo ln -sf $AUTOPOINT /usr/local/bin/autopoint

          else

            echo "ERROR: autopoint missing"
            exit 1

          fi


          echo "Checking..."

          which autopoint
          autopoint --version



      # -----------------------------
      # Verify tools
      # -----------------------------
      - name: Verify tools
        run: |

          echo "==== AUTOTOOLS ===="

          autoconf --version
          automake --version
          libtool --version

          echo "==== BUILD ===="

          cmake --version
          ninja --version
          pkg-config --version



      # -----------------------------
      # Android setup
      # -----------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      - name: Setup Android NDK
        run: |

          sdkmanager \
          "ndk;${ANDROID_NDK_VERSION}"



      # -----------------------------
      # Bootstrap contrib
      # -----------------------------
      - name: Bootstrap contrib
        run: |

          cd daemon/contrib

          ./bootstrap



      # -----------------------------
      # Build contrib
      # -----------------------------
      - name: Build contrib libraries
        run: |

          cd daemon/contrib

          make fetch

          make -j$(nproc)



      # -----------------------------
      # Build Android
      # -----------------------------
      - name: Build Android APK
        run: |

          chmod +x gradlew

          ./gradlew \
            assembleDebug \
            --no-daemon \
            --stacktrace



      # -----------------------------
      # Upload APK
      # -----------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4

        with:

          name: jami-debug-apk

          path: |
            **/build/outputs/apk/**/*.apk
