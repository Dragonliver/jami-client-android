name: Build Jami Android

on:
  push:
    branches:
      - main

  workflow_dispatch:


jobs:

  build:

    runs-on: ubuntu-latest


    env:
      ANDROID_NDK_VERSION: 26.3.11579264


    steps:


      # -------------------------------
      # Source
      # -------------------------------
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive



      # -------------------------------
      # Update Ubuntu
      # -------------------------------
      - name: Update system
        run: |

          sudo apt-get update

          sudo apt-get upgrade -y



      # -------------------------------
      # Dependencies
      # -------------------------------
      - name: Install build dependencies
        shell: bash
        run: |

          sudo apt-get install -y \
            build-essential \
            gcc \
            g++ \
            make \
            git \
            wget \
            curl \
            ca-certificates \
            pkg-config \
            autoconf \
            automake \
            gettext \
            gettext-base \
            libtool \
            libtool-bin \
            m4 \
            cmake \
            ninja-build \
            meson \
            python3 \
            python3-pip \
            yasm \
            nasm \
            bison \
            flex \
            patch \
            unzip \
            zip \
            xz-utils \
            zlib1g-dev \
            libssl-dev \
            libxml2-dev \
            libxslt1-dev \
            libffi-dev \
            libncurses-dev



      # -------------------------------
      # Fix autopoint
      # -------------------------------
      - name: Fix autopoint
        shell: bash
        run: |


          echo "Searching autopoint..."

          AUTOPOINT=$(find /usr -type f -name autopoint 2>/dev/null | head -1)


          if [ -z "$AUTOPOINT" ]; then

            echo "autopoint not found"

            echo "Installing gettext again"

            sudo apt-get install --reinstall -y gettext gettext-base

            AUTOPOINT=$(find /usr -type f -name autopoint 2>/dev/null | head -1)

          fi



          if [ -z "$AUTOPOINT" ]; then

            echo "ERROR: autopoint still missing"

            dpkg -L gettext

            exit 1

          fi



          echo "Found autopoint:"
          echo "$AUTOPOINT"



          sudo chmod +x "$AUTOPOINT"


          sudo ln -sf "$AUTOPOINT" /usr/local/bin/autopoint



          echo "/usr/local/bin" >> $GITHUB_PATH

          echo "/usr/bin" >> $GITHUB_PATH



          echo "Checking autopoint"

          which autopoint

          autopoint --version





      # -------------------------------
      # Verify tools
      # -------------------------------
      - name: Verify tools
        run: |


          echo "PATH:"
          echo $PATH


          echo "Autopoint:"
          which autopoint
          autopoint --version


          echo "Autoconf:"
          autoconf --version


          echo "Automake:"
          automake --version


          echo "Libtool:"
          libtool --version


          echo "CMake:"
          cmake --version



      # -------------------------------
      # Android SDK
      # -------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3



      # -------------------------------
      # Android NDK
      # -------------------------------
      - name: Install Android NDK
        run: |


          sdkmanager \
            "ndk;${ANDROID_NDK_VERSION}"



      # -------------------------------
      # Build contrib
      # -------------------------------
      - name: Bootstrap contrib
        run: |


          cd daemon/contrib


          ./bootstrap



      - name: Build contrib libraries
        run: |


          cd daemon/contrib


          make fetch


          make -j$(nproc)





      # -------------------------------
      # Build Jami Android
      # -------------------------------
      - name: Build Android APK
        run: |


          chmod +x gradlew


          ./gradlew \
            assembleDebug \
            --no-daemon \
            --stacktrace





      # -------------------------------
      # Upload APK
      # -------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4

        with:

          name: jami-debug-apk

          path: |

            **/build/outputs/apk/**/*.apk
