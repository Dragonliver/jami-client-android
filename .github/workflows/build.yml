name: Build Jami Android

on:
  push:
    branches:
      - main

  workflow_dispatch:


jobs:

  build:

    runs-on: ubuntu-latest


    env:
      ANDROID_NDK_VERSION: 26.3.11579264


    steps:


      # -----------------------------
      # Checkout
      # -----------------------------
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive



      # -----------------------------
      # Update system
      # -----------------------------
      - name: Update system
        run: |

          sudo apt-get update

          sudo apt-get upgrade -y



      # -----------------------------
      # Install dependencies
      # -----------------------------
      - name: Install dependencies
        shell: bash
        run: |

          sudo apt-get update


          sudo apt-get install -y \
            build-essential \
            gcc \
            g++ \
            make \
            git \
            wget \
            curl \
            ca-certificates \
            pkg-config \
            autoconf \
            automake \
            gettext \
            gettext-base \
            libtool \
            libtool-bin \
            m4 \
            cmake \
            ninja-build \
            meson \
            python3 \
            python3-pip \
            yasm \
            nasm \
            bison \
            flex \
            patch \
            unzip \
            zip \
            xz-utils \
            zlib1g-dev \
            libssl-dev \
            libxml2-dev \
            libxslt1-dev \
            libffi-dev \
            libncurses-dev




      # -----------------------------
      # Setup autopoint
      # -----------------------------
      - name: Setup autopoint
        shell: bash
        run: |


          sudo apt-get install --reinstall -y \
            gettext \
            gettext-base



          echo "Searching autopoint"


          AUTOPOINT=$(find /usr -type f -name autopoint 2>/dev/null | head -1)



          if [ -z "$AUTOPOINT" ]; then

              echo "ERROR: autopoint not found"

              dpkg -L gettext

              exit 1

          fi



          echo "Found:"
          echo "$AUTOPOINT"



          sudo chmod +x "$AUTOPOINT"



          sudo ln -sf "$AUTOPOINT" /usr/bin/autopoint

          sudo ln -sf "$AUTOPOINT" /usr/local/bin/autopoint



          echo "/usr/bin" >> $GITHUB_PATH

          echo "/usr/local/bin" >> $GITHUB_PATH



          echo "Checking autopoint"


          /usr/bin/autopoint --version





      # -----------------------------
      # Verify autotools
      # -----------------------------
      - name: Verify autotools
        shell: bash
        run: |


          echo "PATH:"
          echo $PATH


          echo "autopoint"

          which autopoint

          autopoint --version



          echo "autoreconf"

          which autoreconf

          autoreconf --version





      # -----------------------------
      # Android SDK
      # -----------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3





      # -----------------------------
      # Android NDK
      # -----------------------------
      - name: Install NDK
        run: |


          sdkmanager \
          "ndk;${ANDROID_NDK_VERSION}"





      # -----------------------------
      # Bootstrap contrib
      # -----------------------------
      - name: Bootstrap contrib
        shell: bash
        run: |


          cd daemon/contrib


          export PATH="/usr/local/bin:/usr/bin:$PATH"


          ./bootstrap





      # -----------------------------
      # Build contrib
      # -----------------------------
      - name: Build contrib
        shell: bash
        run: |


          cd daemon/contrib



          export PATH="/usr/local/bin:/usr/bin:$PATH"


          export ACLOCAL_PATH="/usr/share/aclocal"


          export AUTOPOINT="/usr/bin/autopoint"


          export AUTOM4TE="/usr/bin/autom4te"



          echo "===== ENV ====="

          echo $PATH


          which autopoint


          autopoint --version



          echo "===== FETCH ====="


          make fetch



          echo "===== BUILD ====="



          make \
          AUTOTOOLS="autopoint" \
          -j$(nproc)





      # -----------------------------
      # Build APK
      # -----------------------------
      - name: Build APK
        shell: bash
        run: |


          chmod +x gradlew


          export PATH="/usr/local/bin:/usr/bin:$PATH"


          ./gradlew \
            assembleDebug \
            --no-daemon \
            --stacktrace





      # -----------------------------
      # Upload APK
      # -----------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4

        with:

          name: jami-debug-apk

          path: |

            **/build/outputs/apk/**/*.apk
