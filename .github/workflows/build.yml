name: Build Jami Android

on:
  push:
    branches:
      - main

  workflow_dispatch:


jobs:

  build:

    runs-on: ubuntu-latest


    env:
      ANDROID_NDK_VERSION: 26.3.11579264


    steps:


      # --------------------------------
      # Checkout
      # --------------------------------
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive



      # --------------------------------
      # Update
      # --------------------------------
      - name: Update system
        run: |

          sudo apt-get update

          sudo apt-get upgrade -y




      # --------------------------------
      # Dependencies
      # --------------------------------
      - name: Install dependencies
        run: |

          sudo apt-get install -y \
            build-essential \
            gcc \
            g++ \
            make \
            git \
            wget \
            curl \
            ca-certificates \
            pkg-config \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            m4 \
            cmake \
            ninja-build \
            meson \
            python3 \
            unzip \
            zip \
            xz-utils \
            zlib1g-dev \
            libssl-dev \
            libxml2-dev \
            libxslt1-dev \
            libffi-dev \
            libncurses-dev



      # --------------------------------
      # Build gettext with autopoint
      # --------------------------------
      - name: Install gettext autopoint
        shell: bash
        run: |


          cd /tmp



          wget https://ftp.gnu.org/gnu/gettext/gettext-0.22.5.tar.gz



          tar xf gettext-0.22.5.tar.gz



          cd gettext-0.22.5



          ./configure \
            --prefix=/usr/local



          make -j$(nproc)



          sudo make install



          sudo ldconfig



          echo "/usr/local/bin" >> $GITHUB_PATH



          echo "Checking gettext"



          which autopoint


          autopoint --version





      # --------------------------------
      # Verify autotools
      # --------------------------------
      - name: Verify autotools
        shell: bash
        run: |


          echo "PATH:"
          echo $PATH


          echo "autopoint"

          which autopoint

          autopoint --version



          echo "autoreconf"

          which autoreconf

          autoreconf --version



          echo "automake"

          automake --version



          echo "libtool"

          libtool --version





      # --------------------------------
      # Android SDK
      # --------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3




      # --------------------------------
      # Android NDK
      # --------------------------------
      - name: Install Android NDK
        run: |


          sdkmanager \
            "ndk;${ANDROID_NDK_VERSION}"





      # --------------------------------
      # Bootstrap contrib
      # --------------------------------
      - name: Bootstrap contrib
        shell: bash
        run: |


          export PATH="/usr/local/bin:/usr/bin:$PATH"



          cd daemon/contrib



          ./bootstrap





      # --------------------------------
      # Build contrib
      # --------------------------------
      - name: Build contrib
        shell: bash
        run: |


          export PATH="/usr/local/bin:/usr/bin:$PATH"


          export ACLOCAL_PATH="/usr/local/share/aclocal:/usr/share/aclocal"



          echo "Before make"


          which autopoint


          autopoint --version



          cd daemon/contrib



          make fetch



          make -j$(nproc)





      # --------------------------------
      # Build Android
      # --------------------------------
      - name: Build APK
        shell: bash
        run: |


          chmod +x gradlew



          export PATH="/usr/local/bin:/usr/bin:$PATH"



          ./gradlew \
            assembleDebug \
            --no-daemon \
            --stacktrace





      # --------------------------------
      # Upload
      # --------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4

        with:

          name: jami-debug-apk

          path:

            **/build/outputs/apk/**/*.apk
