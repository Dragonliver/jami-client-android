name: Build Jami Android APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch: # Позволяет запустить сборку вручную кнопкой на сайте GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем репозиторий (вместе с вашими изменениями)
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive # Обязательно для подтягивания зависимостей Jami

      # 2. Устанавливаем необходимые системные утилиты из вашего списка
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            build-essential \
            swig \
            yasm \
            ninja-build \
            m4 \
            autotools-dev \
            autopoint \
            libtool \
            openjdk-17-jdk

      # 3. Настраиваем окружение Android SDK
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. Запускаем сборку проекта (Gradle)
      - name: Build APK with Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      # 5. Сохраняем готовый APK-файл, чтобы его можно было скачать с сайта GitHub
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jami-custom-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
