name: Build Jami Android

on:
  push:
    branches:
      - main

  workflow_dispatch:


jobs:

  build:

    runs-on: ubuntu-latest


    steps:


      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive



      - name: Install dependencies
        shell: bash
        run: |

          sudo apt-get update


          sudo apt-get install -y \
            build-essential \
            gcc \
            g++ \
            make \
            git \
            wget \
            curl \
            ca-certificates \
            pkg-config \
            autoconf \
            automake \
            gettext \
            gettext-base \
            libtool \
            libtool-bin \
            m4 \
            cmake \
            ninja-build \
            python3 \
            unzip \
            zip \
            xz-utils \
            zlib1g-dev \
            libssl-dev



      # Исправление autopoint
      - name: Fix autopoint
        shell: bash
        run: |


          echo "Searching autopoint"


          AUTOPOINT=$(find /usr -type f -name autopoint 2>/dev/null | head -1)



          if [ -z "$AUTOPOINT" ]; then

            echo "autopoint not found"

            sudo apt-get install --reinstall -y gettext

            AUTOPOINT=$(find /usr -type f -name autopoint 2>/dev/null | head -1)

          fi



          echo "Found: $AUTOPOINT"



          sudo chmod +x "$AUTOPOINT"



          sudo ln -sf "$AUTOPOINT" /usr/bin/autopoint

          sudo ln -sf "$AUTOPOINT" /usr/local/bin/autopoint



          echo "/usr/local/bin" >> $GITHUB_PATH

          echo "/usr/bin" >> $GITHUB_PATH



          /usr/bin/autopoint --version





      # ВАЖНО: патчим gnutls
      - name: Patch gnutls rules
        shell: bash
        run: |


          FILE="daemon/contrib/src/gnutls/rules.mak"



          echo "Before patch"

          grep -n "autoreconf" "$FILE" || true



          sed -i \
          's|autoreconf|PATH=/usr/local/bin:/usr/bin autoreconf|g' \
          "$FILE"



          echo "After patch"

          grep -n "autoreconf" "$FILE" || true





      - name: Setup Android SDK
        uses: android-actions/setup-android@v3





      - name: Setup NDK
        run: |


          sdkmanager \
          "ndk;26.3.11579264"





      - name: Bootstrap contrib
        shell: bash
        run: |


          export PATH="/usr/local/bin:/usr/bin:$PATH"



          cd daemon/contrib



          ./bootstrap





      - name: Build contrib
        shell: bash
        run: |


          export PATH="/usr/local/bin:/usr/bin:$PATH"



          cd daemon/contrib



          echo "autopoint test"

          which autopoint

          autopoint --version



          make fetch



          make -j$(nproc)





      - name: Build APK
        shell: bash
        run: |


          chmod +x gradlew



          export PATH="/usr/local/bin:/usr/bin:$PATH"



          ./gradlew \
            assembleDebug \
            --no-daemon \
            --stacktrace





      - name: Upload APK
        uses: actions/upload-artifact@v4

        with:

          name: jami-debug-apk

          path: |

            **/build/outputs/apk/**/*.apk
